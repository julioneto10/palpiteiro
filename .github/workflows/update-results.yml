name: Atualizar placares (Copa 2026)

# Robo que puxa os placares finalizados da worldcup26.ir e aplica no banco
# (apply_match_result -> recompute_totals). O ranking e a tela /tv atualizam
# sozinhos.
#
# Confiabilidade: o cron do GitHub atrasa/varia bastante. Em vez de depender
# de disparos pontuais, cada execucao roda ~30 min (checa a cada 2,5 min) e e
# agendada 2x/hora com redundancia. concurrency garante so 1 rodando por vez;
# a proxima fica na fila e assume quando esta acabar -> cobertura ~continua.
# Repo publico = minutos de Actions gratis/ilimitados.

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch: {} # permite rodar na mao pelo painel Actions

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Aplicar placares finalizados
        env:
          SUPABASE_URL: https://zpwjfnerdcnaxvqgphku.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOOPS: "12"
          SLEEP_MS: "150000"
        run: node scripts/update-results.mjs
