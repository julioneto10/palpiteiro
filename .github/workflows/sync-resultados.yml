name: Sync resultados Copa 2026

# Mantem os resultados dos jogos atualizados automaticamente.
# Busca os jogos finalizados na TheSportsDB e aplica no Palpiteiro
# pela funcao oficial apply_match_result (pontua + audita).

on:
  schedule:
    - cron: "*/15 * * * *" # a cada 15 min (horario UTC; GitHub pode atrasar alguns min)
  workflow_dispatch: {} # permite rodar manualmente pelo botao "Run workflow"

# evita rodadas concorrentes se uma demorar
concurrency:
  group: sync-resultados
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar resultados finalizados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/sync-resultados.py "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" --apply
