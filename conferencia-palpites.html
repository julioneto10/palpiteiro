<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bolão dos Guerreiros — Conferência de Palpites</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1115;color:#e6e8ee;line-height:1.5;padding:24px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:24px;margin-bottom:4px}
.sub{color:#8b93a7;font-size:14px;margin-bottom:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px}
.card{background:#1a1d27;border:1px solid #262a38;border-radius:12px;padding:16px}
.card .n{font-size:30px;font-weight:700}
.card .l{font-size:13px;color:#8b93a7;margin-top:2px}
.ok{color:#3ddc84} .warn{color:#ffb84d} .bad{color:#ff6b6b}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#8b93a7;margin:24px 0 10px}
.member{background:#1a1d27;border:1px solid #262a38;border-radius:12px;margin-bottom:10px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.mhead:hover{background:#20242f}
.avatar{width:36px;height:36px;border-radius:50%;background:#2a2f3d;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.mname{font-weight:600;flex:1}
.mname .role{font-size:11px;color:#8b93a7;font-weight:400;margin-left:6px}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
.badge.ok{background:rgba(61,220,132,.15)} .badge.warn{background:rgba(255,184,77,.15)} .badge.bad{background:rgba(255,107,107,.15)}
.bar{height:6px;border-radius:3px;background:#262a38;width:120px;overflow:hidden;flex-shrink:0}
.bar>div{height:100%}
.chev{color:#8b93a7;transition:transform .2s}
.member.open .chev{transform:rotate(90deg)}
.preds{display:none;padding:0 16px 16px;border-top:1px solid #262a38}
.member.open .preds{display:block}
.grp{margin-top:14px}
.grp h4{font-size:12px;color:#8b93a7;margin-bottom:6px;text-transform:uppercase}
.pred-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.pred{display:flex;align-items:center;justify-content:space-between;background:#13161f;border:1px solid #20242f;border-radius:8px;padding:6px 10px;font-size:13px}
.pred.miss{border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.06)}
.pred .teams{color:#cbd0dd} .pred .sc{font-weight:700;font-variant-numeric:tabular-nums}
.pred.miss .sc{color:#ff6b6b}
.filter{margin:0 0 16px;display:flex;gap:8px;flex-wrap:wrap}
.filter button{background:#1a1d27;border:1px solid #262a38;color:#e6e8ee;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px}
.filter button.active{background:#3a4256;border-color:#4a5470}
.foot{color:#5a6175;font-size:12px;margin-top:30px;text-align:center}
</style></head>

    const cls=st==='complete'?'ok':st==='partial'?'warn':'bad';
    const pct=Math.round(m.count/T*100);
    const el=document.createElement('div'); el.className='member';
    let predsHtml='';
    if(m.count>0){
      groupKeys.forEach(g=>{
        const gm=byGroup[g];
        const cards=gm.map(mt=>{
          const p=m.preds[mt.id];
          if(p) return `<div class="pred"><span class="teams">${mt.home.code} × ${mt.away.code}</span><span class="sc">${p.h}–${p.a}</span></div>`;
          return `<div class="pred miss"><span class="teams">${mt.home.code} × ${mt.away.code}</span><span class="sc">—</span></div>`;
        }).join('');
        predsHtml+=`<div class="grp"><h4>Grupo ${g}</h4><div class="pred-grid">${cards}</div></div>`;
      });
    } else {
      predsHtml='<div class="grp" style="color:#8b93a7;padding-top:14px">Ainda não fez nenhum palpite.</div>';
    }
    el.innerHTML=`
      <div class="mhead">
        <div class="avatar">${initials(m.name)}</div>
        <div class="mname">${m.name}${m.role==='owner'?'<span class="role">👑 dono</span>':''}</div>
        <div class="bar"><div style="width:${pct}%;background:var(--c)" class="${cls}"></div></div>
        <div class="badge ${cls}">${m.count}/${T}</div>
        <div class="chev">▶</div>
      </div>
      <div class="preds">${predsHtml}</div>`;
    el.querySelector('.bar>div').style.background=st==='complete'?'#3ddc84':st==='partial'?'#ffb84d':'#ff6b6b';
    el.querySelector('.mhead').onclick=()=>el.classList.toggle('open');
    list.appendChild(el);
  });
}
document.querySelectorAll('.filter button').forEach(b=>{
  b.onclick=()=>{ document.querySelectorAll('.filter button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); render(b.dataset.f); };
});
render('all');
</script>
</body></html>
